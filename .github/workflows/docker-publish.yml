name: Build and publish Docker image

on:
  push:
    branches: [main]
    tags: ['server-v*']
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'requirements.txt'
      - 'files/**'
      - 'tests/**'
      - 'release-notes/server-*.md'
      - '.github/workflows/docker-publish.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'requirements.txt'
      - 'files/**'
      - 'tests/**'
      - 'release-notes/server-*.md'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/mehmet-b-90/games_collection

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      release_version: ${{ steps.release.outputs.version }}
      image_digest: ${{ steps.publish.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Determine requested server release
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=''
          if [[ "$REF" == refs/tags/server-v* ]]; then
            version="${REF_NAME#server-v}"
          elif [[ "$EVENT_NAME" != pull_request && "$REF" == refs/heads/main ]]; then
            notes=$(git diff --diff-filter=A --name-only HEAD^ HEAD -- 'release-notes/server-*.md')
            if [[ -n "$notes" ]]; then
              [[ $(printf '%s\n' "$notes" | wc -l) -eq 1 ]] || { echo 'Only one server release per commit is supported.'; exit 1; }
              version="${notes#release-notes/server-}"
              version="${version%.md}"
            fi
          fi
          if [[ -n "$version" ]]; then
            [[ "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo 'Invalid server version.'; exit 1; }
            test -f "release-notes/server-$version.md"
            existing=$(git ls-remote origin "refs/tags/server-v$version" "refs/tags/server-v$version^{}")
            if [[ -n "$existing" && "$REF" == refs/heads/main ]]; then
              echo "Server $version already has a release tag; publishing latest/SHA only."
              exit 0
            fi
            if [[ -n "$existing" ]]; then
              target=$(printf '%s\n' "$existing" | awk 'NR == 1 {sha=$1} /\^\{\}$/ {sha=$1} END {print sha}')
              test "$target" = "$GITHUB_SHA" || { echo 'Server version already belongs to another commit.'; exit 1; }
            fi
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU for ARM64 builds
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build local test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: games-collection:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run backend tests in the image
        run: |
          docker run --rm \
            --volume "$PWD/tests:/app/tests:ro" \
            --entrypoint python games-collection:ci \
            -m unittest discover -s tests -v

      - name: Check container startup and health
        run: |
          trap 'docker logs games-collection-smoke; docker rm -f games-collection-smoke' EXIT
          docker run --detach --name games-collection-smoke \
            --env SECRET_KEY="$(openssl rand -hex 32)" \
            games-collection:ci
          for attempt in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' games-collection-smoke)
            if [ "$status" = healthy ]; then
              exit 0
            fi
            if [ "$status" = unhealthy ]; then
              exit 1
            fi
            sleep 2
          done
          exit 1

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long
            type=match,pattern=server-v(.*),group=1
            type=raw,value=${{ steps.release.outputs.version }},enable=${{ steps.release.outputs.version != '' }}

      - name: Sign in to GitHub Container Registry
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/server-v'))
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish AMD64 and ARM64 images
        id: publish
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/server-v'))
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Publish server release notes
    needs: build
    if: needs.build.outputs.release_version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Create tag and GitHub release after image publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.build.outputs.release_version }}
          IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
        run: |
          tag="server-v$RELEASE_VERSION"
          if git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            test "$(git rev-parse "$tag^{commit}")" = "$GITHUB_SHA" || { echo 'Release tag points to another commit.'; exit 1; }
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; keeping the published notes."
            exit 0
          fi
          notes="$RUNNER_TEMP/server-release-notes.md"
          cat "release-notes/server-$RELEASE_VERSION.md" > "$notes"
          printf '\n## Veröffentlichtes Image\n\n`%s@%s`\n' "$IMAGE_NAME" "$IMAGE_DIGEST" >> "$notes"
          gh release create "$tag" --target "$GITHUB_SHA" \
            --title "Games Collection v$RELEASE_VERSION" \
            --notes-file "$notes" --latest
