plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def releasePropertiesFile = rootProject.file('signing.properties')
def releaseProperties = new Properties()
if (releasePropertiesFile.exists()) {
    releasePropertiesFile.withInputStream { releaseProperties.load(it) }
}
def signingFields = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
def releaseSigningReady = signingFields.every { releaseProperties.getProperty(it)?.trim() }

android {
    namespace 'de.gamescollection.viewer'
    compileSdk 36

    defaultConfig {
        applicationId 'de.gamescollection.viewer'
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName '0.7'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures { compose true }
    kotlinOptions { jvmTarget = '17' }

    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile rootProject.file(releaseProperties.getProperty('storeFile'))
                storePassword releaseProperties.getProperty('storePassword')
                keyAlias releaseProperties.getProperty('keyAlias')
                keyPassword releaseProperties.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            debuggable false
            // Shrinking is a separate change that needs runtime validation.
            minifyEnabled false
            shrinkResources false
            if (releaseSigningReady) signingConfig signingConfigs.release
        }
    }

    lint {
        warningsAsErrors true
        // Versions are deliberately pinned; update notices do not indicate a code defect.
        disable 'AndroidGradlePluginVersion', 'GradleDependency', 'NewerVersionAvailable'
    }
}

// Never silently distribute an unsigned APK or use the debug key for release.
def verifyReleaseSigning = tasks.register('verifyReleaseSigning') {
    doLast {
        if (!releaseSigningReady) {
            throw new GradleException('Release-Signierung fehlt. Richte android/signing.properties nach signing.properties.example ein; siehe android/README.md.')
        }
        if (!rootProject.file(releaseProperties.getProperty('storeFile')).isFile()) {
            throw new GradleException('Release-Keystore nicht gefunden. Übertrage den vorhandenen Schlüssel sicher oder richte die erstmalige Signierung ein; siehe android/README.md.')
        }
    }
}
tasks.configureEach {
    if (name in ['packageRelease', 'packageReleaseBundle', 'signReleaseBundle']) {
        dependsOn verifyReleaseSigning
    }
}

android.applicationVariants.all { variant ->
    if (variant.buildType.name == 'release') {
        variant.outputs.all { output ->
            output.outputFileName = "Games-Collection-${variant.versionName}-release.apk"
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2025.09.00')
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'io.coil-kt:coil-compose:2.7.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}
