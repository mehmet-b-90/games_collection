plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'de.gamescollection.viewer'
    compileSdk 36

    defaultConfig {
        applicationId 'de.gamescollection.viewer'
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '0.6'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures { compose true }
    kotlinOptions { jvmTarget = '17' }

    lint {
        warningsAsErrors true
        // Versions are deliberately pinned; update notices do not indicate a code defect.
        disable 'AndroidGradlePluginVersion', 'GradleDependency', 'NewerVersionAvailable'
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2025.09.00')
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'io.coil-kt:coil-compose:2.7.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}
