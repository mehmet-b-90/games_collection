<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111e2d">
    <title>Games Collection – Offline</title>
    <style>
        * { box-sizing: border-box; }
        body { display: grid; place-items: center; min-height: 100vh; margin: 0; padding: 24px; color: #eef4fb; background: #0d1826; font: 16px/1.5 system-ui, sans-serif; }
        main { max-width: 440px; padding: 32px; border: 1px solid #2b3b4f; border-radius: 20px; background: #172638; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
        img { width: 88px; height: 88px; }
        h1 { margin: 18px 0 8px; font-size: 1.55rem; }
        p { margin: 0 0 22px; color: #9eafc2; }
        button { min-height: 44px; padding: 0 18px; border: 0; border-radius: 12px; color: #fff; background: #625cff; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
    <main>
        <img src="/static/icons/app-icon-192.png" alt="">
        <h1>Keine Verbindung</h1>
        <p>Games Collection benötigt eine Verbindung zum Server. Prüfe das Netzwerk und versuche es erneut.</p>
        <button type="button" onclick="location.reload()">Erneut versuchen</button>
    </main>
</body>
</html>
