<!DOCTYPE html>
<html lang="de" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Games Collection</title>
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='icons/app-icon-32.png') }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='icons/apple-touch-icon-180.png') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="d-flex align-items-center justify-content-center vh-100">
    <div class="card text-bg-dark border-secondary shadow mx-3" style="width: 100%; max-width: 400px;">
        <div class="card-body p-4">
            <h4 class="card-title text-center mb-4"><img class="brand-mark d-inline-block align-middle me-2" src="{{ url_for('static', filename='icons/app-icon-192.png') }}" width="38" height="38" alt="">Games Collection</h4>

            {% if error %}
            <div class="alert alert-danger py-2">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{% if action == 'register' %}{{ url_for('auth.register') }}{% else %}{{ url_for('auth.login') }}{% endif %}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label class="form-label">Benutzername</label>
                    <input type="text" class="form-control text-bg-dark" name="username" required autofocus>
                </div>
                <div class="{% if action == 'register' %}mb-3{% else %}mb-4{% endif %}">
                    <label class="form-label">Passwort</label>
                    <input type="password" class="form-control text-bg-dark" name="password" required>
                </div>

                {% if action == 'register' %}
                    <div class="mb-4">
                        <label class="form-label">Passwort bestätigen</label>
                        <input type="password" class="form-control text-bg-dark" name="password_confirm" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mb-3">Registrieren</button>
                    <div class="text-center small">
                        Bereits ein Konto? <a href="{{ url_for('auth.login') }}" class="text-info">Hier einloggen</a>
                    </div>
                {% else %}
                <div class="mb-4 form-check text-start">
                    <input type="checkbox" class="form-check-input" id="rememberCheck" name="remember">
                    <label class="form-check-label small" for="rememberCheck">Eingeloggt bleiben</label>
                </div>
                <button type="submit" class="btn btn-success w-100 mb-3">Einloggen</button>
                <div class="text-center small">
                    Noch kein Konto? <a href="{{ url_for('auth.register') }}" class="text-info">Neuen Nutzer anlegen</a>
                </div>
                {% endif %}
            </form>
        </div>
    </div>
</body>
</html>
